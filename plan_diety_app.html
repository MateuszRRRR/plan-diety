<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Plan diety — Mati & Chania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#F1F3EC; --card:#FFFFFF; --ink:#1C2620; --muted:#5C6B60; --line:#DFE5DA;
  --green:#3E7C4F; --green-soft:#E4F0E6; --honey:#DB9A3E; --honey-soft:#FBF0DC;
  --mati:#3E7C4F; --chania:#96527D; --chania-soft:#F5E9F1;
  --red:#C4553B; --radius:14px;
  --disp:'Bricolage Grotesque',sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:90px}
h1,h2,h3{font-family:var(--disp)}
button{font-family:var(--body);cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,select,textarea{font-family:var(--body);font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}

/* Header */
header{padding:18px 0 10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand .sub{color:var(--muted);font-size:13px;font-weight:500}
.saveflag{font-size:12px;color:var(--muted);margin-left:auto;transition:opacity .4s;opacity:0}
.saveflag.on{opacity:1}

/* Tabs */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;box-shadow:0 -4px 20px rgba(28,38,32,.06)}
.tabs{max-width:980px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:76px;padding:10px 4px 12px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2.5px solid transparent}
.tab svg{width:21px;height:21px;stroke:currentColor}
.tab.on{color:var(--green);border-top-color:var(--green)}

/* Cards & common */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pillrow{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pillrow::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:11px;font-weight:600;font-size:14px;background:var(--green);color:#fff}
.btn.sec{background:var(--green-soft);color:var(--green)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:#FBE9E4;color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--honey-soft);color:#9A6A1E}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.section-title{font-size:17px;font-weight:800;margin:16px 0 10px;font-family:var(--disp)}

/* Person gauge */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:560px){.gauges{grid-template-columns:1fr}}
.gauge{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.gauge .who{font-family:var(--disp);font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%}
.gbar{height:9px;border-radius:99px;background:var(--bg);overflow:hidden;margin:5px 0 2px}
.gbar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.glabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500}
.macmini{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)}
.macmini b{color:var(--ink)}

/* Meal blocks */
.meal{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.meal-h{padding:10px 14px;background:linear-gradient(0deg,rgba(62,124,79,.04),rgba(62,124,79,.04));border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.mperson{padding:9px 14px;border-bottom:1px solid var(--line)}
.mperson:last-child{border-bottom:none}
.mp-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:5px}
.dish{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg);border-radius:10px;margin-bottom:6px}
.dish .dn{flex:1;font-weight:600;font-size:13.5px;line-height:1.3}
.dish .dm{font-size:11px;color:var(--muted)}
.step{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:8px}
.step button{width:26px;height:26px;font-weight:700;color:var(--green);font-size:15px}
.step span{min-width:26px;text-align:center;font-size:12.5px;font-weight:700}
.xbtn{width:26px;height:26px;border-radius:8px;color:var(--red);font-size:16px;font-weight:600;flex-shrink:0}
.addd{font-size:12.5px;font-weight:600;color:var(--green);padding:5px 2px;display:inline-flex;gap:4px;align-items:center}

/* Recipe list */
.rcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:9px}
.rcard .rn{font-weight:700;font-size:15px;font-family:var(--disp)}
.rmac{display:flex;gap:11px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.rmac b{color:var(--ink)}
.rdesc{font-size:12.5px;color:var(--muted);margin-top:4px}
.ringlist{margin-top:8px;font-size:13px;display:none}
.ringlist.open{display:block}
.ringlist li{list-style:none;padding:4px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between}

/* Shopping */
.shopcat{font-family:var(--disp);font-weight:800;font-size:14px;margin:14px 0 6px;color:var(--green)}
.shopitem{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:6px}
.shopitem.done{opacity:.45}
.shopitem.done .sn{text-decoration:line-through}
.chk{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.shopitem.done .chk{background:var(--green);border-color:var(--green)}
.sn{flex:1;font-weight:600;font-size:14px}
.sq{font-size:13px;color:var(--muted);font-weight:600}

/* Table */
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{text-align:left;padding:7px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--line)}
.ptable td{padding:8px;border-bottom:1px solid var(--line)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(28,38,32,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;width:100%;max-width:600px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal-h{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:17px;font-weight:800}
.modal-b{padding:14px 18px;overflow-y:auto;flex:1}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pick{padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.pick:hover{border-color:var(--green);background:var(--green-soft)}
.pick .pn{font-weight:600;font-size:14px}
.pick .pm{font-size:11.5px;color:var(--muted)}
.inge{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.inge input.q{width:70px;flex-shrink:0}
.inge select{flex:1;min-width:0}

/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:13px}
.wd{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:7px 3px 6px;text-align:center;cursor:pointer}
.wd.on{border-color:var(--ink);background:var(--ink);color:#fff}
.wd .dn2{font-size:11px;font-weight:800;font-family:var(--disp)}
.wd .dk{font-size:9.5px;color:var(--muted);margin-top:1px}
.wd.on .dk{color:rgba(255,255,255,.7)}
.wd .mini{height:3.5px;border-radius:9px;background:var(--bg);margin-top:4px;overflow:hidden}
.wd.on .mini{background:rgba(255,255,255,.25)}
.wd .mini i{display:block;height:100%;background:var(--green)}
.wd.on .mini i{background:#7FD494}

.searchbox{position:relative;margin-bottom:10px}
.calc-out{background:var(--ink);color:#E8EFE9;border-radius:var(--radius);padding:15px;font-size:14px;white-space:pre-wrap;font-variant-numeric:tabular-nums;line-height:1.7}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

  <div class="brand">

function recipeMacrosFromIngs(r){
  let p=0,f=0,c=0;
  for(const ing of (r.ings||[])){
    const pr=productByName(ing.product);
    if(!pr)continue;
    p+=pr.p*ing.qty;f+=pr.f*ing.qty;c+=pr.c*ing.qty;
  }

}
function dayTotals(di,person){

}

/* ================= PLAN VIEW ================= */
function personColor(p){return p==='Mati'?'var(--mati)':'var(--chania)'}
function viewPlan(){
  const week=DAYS.map((d,i)=>{
    const tm=dayTotals(i,'Mati'),th=dayTotals(i,'Chania');
    const pct=Math.min(100,Math.round(100*(tm.kcal+th.kcal)/((S.targets.Mati.kcal+S.targets.Chania.kcal)||1)));
    return `<div class="wd ${i===curDay?'on':''}" onclick="setDay(${i})"><div class="dn2">${DAYS_SHORT[i]}</div><div class="mini"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
  const gauges=PERSONS.map(p=>{
    const t=dayTotals(curDay,p),tg=S.targets[p];
    const kp=Math.min(100,Math.round(100*t.kcal/(tg.kcal||1)));
    const pp=Math.min(100,Math.round(100*t.p/(tg.p||1)));
    const over=t.kcal>tg.kcal*1.05;
    return `<div class="gauge">
      <div class="who"><span class="dot" style="background:${personColor(p)}"></span>${p}</div>
      <div class="glabel" style="margin-top:7px"><span>Kalorie</span><span><b style="color:${over?'var(--red)':'var(--ink)'}">${Math.round(t.kcal)}</b> / ${tg.kcal} kcal</span></div>
      <div class="gbar"><i style="width:${kp}%;background:${over?'var(--red)':personColor(p)}"></i></div>
      <div class="glabel"><span>Białko</span><span><b>${Math.round(t.p)}</b> / ${tg.p} g</span></div>
      <div class="gbar"><i style="width:${pp}%;background:var(--honey)"></i></div>
      <div class="macmini"><span>Tłuszcz <b>${Math.round(t.f)} g</b></span><span>Węgle <b>${Math.round(t.c)} g</b></span></div>
    </div>`;
  }).join('');
  const meals=MEALS.map(meal=>{
    const persons=PERSONS.map(p=>{
      const key=`${DAYS[curDay]}|${meal}|${p}`;
      const cell=S.plan[key]||[];
      const dishes=cell.map((e,ei)=>{
        const r=recipeById(e.r);if(!r)return'';
        return `<div class="dish">
          <div class="grow"><div class="dn">${esc(r.name)}</div><div class="dm">${Math.round(r.kcal*e.n)} kcal · B ${Math.round(r.p*e.n)} g</div></div>
          <div class="step"><button onclick="chPortion('${key}',${ei},-0.5)">−</button><span>${(''+e.n).replace('.',',')}</span><button onclick="chPortion('${key}',${ei},0.5)">+</button></div>
          <button class="xbtn" onclick="rmDish('${key}',${ei})">×</button>
        </div>`;
      }).join('');
      return `<div class="mperson">
        <div class="mp-h" style="color:${personColor(p)}"><span class="dot" style="background:${personColor(p)}"></span>${p}</div>
        ${dishes}
        <button class="addd" onclick="openPicker('${key}','${meal}')">+ dodaj danie</button>
      </div>`;
    }).join('');
    return `<div class="meal"><div class="meal-h">${meal}</div>${persons}</div>`;
  }).join('');
  return `<div class="week">${week}</div>
    <h2 class="section-title" style="margin-top:4px">${DAYS[curDay].charAt(0).toUpperCase()+DAYS[curDay].slice(1)}</h2>
    <div class="gauges">${gauges}</div>${meals}
    <div class="row" style="margin-top:14px">
      <button class="btn ghost sm" onclick="copyDay()">Kopiuj dzień na jutro</button>
      <button class="btn danger sm" onclick="clearDay()">Wyczyść dzień</button>
    </div>`;
}
function setDay(i){curDay=i;render()}
function chPortion(key,i,d){const c=S.plan[key];if(!c||!c[i])return;c[i].n=Math.max(0.5,r1(c[i].n+d));persist();render()}
function rmDish(key,i){S.plan[key].splice(i,1);if(!S.plan[key].length)delete S.plan[key];persist();render()}
function copyDay(){
  const next=(curDay+1)%7;
  for(const meal of MEALS)for(const p of PERSONS){
    const src=S.plan[`${DAYS[curDay]}|${meal}|${p}`];
    const dk=`${DAYS[next]}|${meal}|${p}`;
    if(src&&src.length)S.plan[dk]=JSON.parse(JSON.stringify(src));else delete S.plan[dk];
  }
  persist();toast(`Skopiowano na ${DAYS[next]}`);
}
function clearDay(){
  if(!confirm(`Wyczyścić cały ${DAYS[curDay]}?`))return;
  for(const meal of MEALS)for(const p of PERSONS)delete S.plan[`${DAYS[curDay]}|${meal}|${p}`];
  persist();render();
}

/* dish picker */
let pickerKey=null,pickerMeal=null,pickerAll=false,pickerQ='';
function openPicker(key,meal){pickerKey=key;pickerMeal=meal;pickerAll=false;pickerQ='';showModal(pickerHTML());setTimeout(()=>{const i=document.getElementById('pickq');if(i)i.focus()},50)}
function pickerHTML(){
  const q=pickerQ.toLowerCase();
  let list=S.recipes.filter(r=>(pickerAll||r.meal===pickerMeal)&&(!q||r.name.toLowerCase().includes(q)));
  list.sort((a,b)=>a.name.localeCompare(b.name,'pl'));
  const items=list.map(r=>`<div class="pick" onclick="pickDish(${r.id})">
      <div><div class="pn">${esc(r.name)}</div><div class="pm">${Math.round(r.kcal)} kcal · B ${Math.round(r.p)} g · T ${Math.round(r.f)} g · W ${Math.round(r.c)} g</div></div>
      <span class="tag">${esc(r.meal)}</span></div>`).join('')||'<div class="empty">Brak dań. Zmień filtr lub dodaj przepis w zakładce Przepisy.</div>';
  return `<div class="modal-h"><h3>Wybierz danie — ${esc(pickerMeal)}</h3><button class="xbtn" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div class="searchbox"><input id="pickq" placeholder="Szukaj dania…" value="${esc(pickerQ)}" oninput="pickerQ=this.value;refreshPicker()"></div>
      <div class="pillrow">
        <button class="pill ${!pickerAll?'on':''}" onclick="pickerAll=false;refreshPicker()">Tylko ${esc(pickerMeal)}</button>
        <button class="pill ${pickerAll?'on':''}" onclick="pickerAll=true;refreshPicker()">Wszystkie dania</button>
      </div>
      <div id="picklist">${items}</div>

}
function refreshPicker(){const m=document.getElementById('modal');const sc=m.querySelector('.modal-b').scrollTop;m.innerHTML=pickerHTML();m.querySelector('.modal-b').scrollTop=sc;const i=document.getElementById('pickq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
function pickDish(id){
  if(!S.plan[pickerKey])S.plan[pickerKey]=[];

  persist();closeModal();render();
}

function saveRecipe(id){
  const name=document.getElementById('e_name').value.trim();

    ings:editIngs.filter(i=>i.product&&i.qty>0)};

  else{data.id=Math.max(0,...S.recipes.map(r=>r.id))+1;S.recipes.push(data)}
  persist();closeModal();render();toast('Przepis zapisany');

function delRecipe(id){
  const used=Object.values(S.plan).some(cell=>cell.some(e=>e.r===id));
  if(!confirm(used?'To danie jest w planie tygodnia — usunąć mimo to?':'Usunąć przepis?'))return;
  S.recipes=S.recipes.filter(r=>r.id!==id);
  for(const k of Object.keys(S.plan)){S.plan[k]=S.plan[k].filter(e=>e.r!==id);if(!S.plan[k].length)delete S.plan[k]}
  persist();render();
}

    p:parseFloat(document.getElementById('p_p').value)||0,f:parseFloat(document.getElementById('p_f').value)||0,c:parseFloat(document.getElementById('p_c').value)||0};
  if(oldName){
    Object.assign(productByName(oldName),data);
    if(oldName!==name)for(const r of S.recipes)for(const i of (r.ings||[]))if(i.product===oldName)i.product=name;
  }else{
    if(productByName(name)){toast('Taki produkt już istnieje');return}
    S.products.push(data);
  }
  persist();closeModal();render();toast('Produkt zapisany');
}
function delProduct(name){
  const used=S.recipes.some(r=>(r.ings||[]).some(i=>i.product===name));

  S.products=S.products.filter(p=>p.name!==name);
  persist();closeModal();render();
}

/* ================= SHOPPING ================= */
function buildShopping(){
  const agg={};
  for(const key of Object.keys(S.plan)){
    for(const e of S.plan[key]){
      const r=recipeById(e.r);if(!r)continue;
      for(const ing of (r.ings||[])){
        const k=ing.product+'|'+ing.unit;
        if(!agg[k])agg[k]={product:ing.product,unit:ing.unit,qty:0};
        agg[k].qty+=ing.qty*e.n;
      }
    }
  }
  return Object.values(agg);
}
function viewShop(){
  const items=buildShopping();
  if(!items.length)return '<div class="empty">Plan tygodnia jest pusty — dodaj dania w zakładce Plan, a lista zakupów zbuduje się sama.</div>';
  const byCat={};
  for(const it of items){
    const p=productByName(it.product);
    const cat=(p&&p.cat)||'Inne';
    (byCat[cat]=byCat[cat]||[]).push(it);
  }
  const catOrder=CATS.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CATS.includes(c)));
  let done=0;
  const html=catOrder.map(cat=>{
    const rows=byCat[cat].sort((a,b)=>a.product.localeCompare(b.product,'pl')).map(it=>{
      const id=it.product+'|'+it.unit;
      const ch=!!S.checked[id];if(ch)done++;
      return `<div class="shopitem ${ch?'done':''}" onclick="toggleShop('${id.replace(/'/g,"\\'")}')">
        <div class="chk">${ch?'✓':''}</div><div class="sn">${esc(it.product)}</div><div class="sq">${fmtQ(it.qty,it.unit)}</div></div>`;
    }).join('');
    return `<div class="shopcat">${esc(cat)}</div>${rows}`;
  }).join('');
  return `<div class="row" style="margin-bottom:4px">
      <div class="grow muted" style="font-size:13px">Zbudowana z planu tygodnia · ${items.length} pozycji</div>
      <button class="btn ghost sm" onclick="copyShop()">Kopiuj listę</button>
      <button class="btn sec sm" onclick="S.checked={};persist();render()">Odznacz</button>
    </div>${html}`;
}
function toggleShop(id){S.checked[id]=!S.checked[id];persist();render()}
function copyShop(){
  const items=buildShopping();
  const byCat={};
  for(const it of items){const p=productByName(it.product);const c=(p&&p.cat)||'Inne';(byCat[c]=byCat[c]||[]).push(it)}
  let txt='LISTA ZAKUPÓW\n';
  for(const c of Object.keys(byCat)){txt+='\n'+c.toUpperCase()+'\n';for(const it of byCat[c].sort((a,b)=>a.product.localeCompare(b.product,'pl')))txt+=`• ${it.product} — ${fmtQ(it.qty,it.unit)}\n`}
  navigator.clipboard.writeText(txt).then(()=>toast('Lista skopiowana do schowka')).catch(()=>toast('Nie udało się skopiować'));
}

/* ================= PORTION CALC ================= */
let calcDish=null,calcN=1;
function viewCalc(){
  const opts=S.recipes.slice().sort((a,b)=>a.name.localeCompare(b.name,'pl'))
    .map(r=>`<option value="${r.id}" ${calcDish===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
  let out='';
  if(calcDish){
    const r=recipeById(calcDish);
    if(r&&r.ings&&r.ings.length){
      const lines=r.ings.map(i=>`${fmtQ(i.qty*calcN,i.unit).padEnd(14)} ${i.product}`).join('\n');
      out=`<div class="calc-out">${esc((''+calcN).replace('.',','))} × ${esc(r.name)}\n${'—'.repeat(26)}\n${esc(lines)}\n${'—'.repeat(26)}\n${Math.round(r.kcal*calcN)} kcal · B ${Math.round(r.p*calcN)} g · T ${Math.round(r.f*calcN)} g · W ${Math.round(r.c*calcN)} g</div>
      <button class="btn ghost sm" style="margin-top:10px" onclick="copyCalc()">Kopiuj</button>`;
    }else if(r){
      out=`<div class="calc-out">${esc(r.name)} — brak listy składników.\n${Math.round(r.kcal*calcN)} kcal · B ${Math.round(r.p*calcN)} g · T ${Math.round(r.f*calcN)} g · W ${Math.round(r.c*calcN)} g</div>`;
    }
  }
  return `<div class="card">
    <div class="field"><label>Danie</label><select onchange="calcDish=parseInt(this.value)||null;render()"><option value="">— wybierz danie —</option>${opts}</select></div>
    <div class="field"><label>Liczba porcji</label>
      <div class="row"><div class="step" style="transform:scale(1.25);transform-origin:left"><button onclick="calcN=Math.max(0.5,r1(calcN-0.5));render()">−</button><span>${(''+calcN).replace('.',',')}</span><button onclick="calcN=r1(calcN+0.5);render()">+</button></div></div></div>
  </div>${out}`;
}
function copyCalc(){
  const r=recipeById(calcDish);if(!r)return;
  let txt=`${(''+calcN).replace('.',',')} × ${r.name}\n`;
  for(const i of r.ings)txt+=`• ${i.product} — ${fmtQ(i.qty*calcN,i.unit)}\n`;
  navigator.clipboard.writeText(txt).then(()=>toast('Skopiowano')).catch(()=>toast('Nie udało się skopiować'));
}

/* ================= ARCHIVE ================= */
function viewArch(){
  const items=archive.slice().reverse().map((a,idx)=>{
    const i=archive.length-1-idx;
    const n=Object.values(a.plan).reduce((s,c)=>s+c.length,0);
    return `<div class="card"><div class="row">
      <div class="grow"><b style="font-family:var(--disp)">Tydzień od ${esc(a.weekStart||'—')}</b>
        <div class="muted" style="font-size:12px">zapisano ${esc(a.savedAt)} · ${n} pozycji w planie</div></div>
      <button class="btn sec sm" onclick="restoreArch(${i})">Przywróć</button>
      <button class="btn danger sm" onclick="delArch(${i})">Usuń</button>
    </div></div>`;
  }).join('')||'<div class="empty">Archiwum jest puste. Po skończonym tygodniu zapisz plan poniżej.</div>';
  return `<div class="card" style="background:var(--green-soft);border-color:var(--green)">
    <b style="font-family:var(--disp)">Zakończ tydzień</b>
    <div class="muted" style="font-size:13px;margin:4px 0 10px">Zapisuje obecny plan do archiwum i czyści siatkę na nowy tydzień. Lista zaznaczonych zakupów też się wyczyści.</div>
    <button class="btn" onclick="archiveWeek()">Zapisz tydzień do archiwum</button>
  </div>${items}`;
}
function archiveWeek(){
  if(!Object.keys(S.plan).length){toast('Plan jest pusty');return}
  const d=new Date();
  archive.push({savedAt:d.toLocaleDateString('pl-PL'),weekStart:S.weekStart||'',plan:JSON.parse(JSON.stringify(S.plan))});
  S.plan={};S.checked={};
  const monday=new Date();monday.setDate(monday.getDate()+((8-monday.getDay())%7||7));
  S.weekStart=monday.toISOString().slice(0,10);
  persist();persistArchive();render();toast('Tydzień zapisany w archiwum');
}
function restoreArch(i){
  if(!confirm('Przywrócić ten tydzień? Obecny plan zostanie nadpisany.'))return;
  S.plan=JSON.parse(JSON.stringify(archive[i].plan));S.checked={};
  persist();go('plan');toast('Plan przywrócony');
}
function delArch(i){if(!confirm('Usunąć wpis z archiwum?'))return;archive.splice(i,1);persistArchive();render()}

/* ================= SETTINGS ================= */
function viewSet(){
  return `<div class="card">
    <b style="font-family:var(--disp)">Cele dzienne</b>
    ${PERSONS.map(p=>`<div style="margin-top:12px">
      <div class="mp-h" style="color:${personColor(p)}"><span class="dot" style="background:${personColor(p)}"></span>${p}</div>
      <div class="f2">
        <div class="field"><label>Kalorie [kcal]</label><input type="number" value="${S.targets[p].kcal}" onchange="S.targets['${p}'].kcal=parseInt(this.value)||0;persist();"></div>
        <div class="field"><label>Białko [g]</label><input type="number" value="${S.targets[p].p}" onchange="S.targets['${p}'].p=parseInt(this.value)||0;persist();"></div>
      </div></div>`).join('')}
  </div>
  <div class="card">
    <div class="field"><label>Początek tygodnia (data)</label><input type="date" value="${esc(S.weekStart||'')}" onchange="S.weekStart=this.value;persist()"></div>
  </div>
  <div class="card">
    <b style="font-family:var(--disp)">Dane</b>
    <div class="muted" style="font-size:13px;margin:4px 0 10px">Wszystko zapisuje się automatycznie i zostaje między sesjami.</div>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn ghost sm" onclick="exportData()">Eksportuj dane (JSON)</button>
      <button class="btn danger sm" onclick="resetData()">Przywróć dane z Excela</button>
    </div>
  </div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify({data:S,archive},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plan_diety_backup.json';a.click();
}
function resetData(){
  if(!confirm('Nadpisać wszystko oryginalnymi danymi z pliku Excel? Zmiany przepadną (archiwum zostaje).'))return;
  S=JSON.parse(JSON.stringify(SEED));S.checked={};persist();render();toast('Przywrócono dane z Excela');
}

/* ================= SHELL ================= */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').classList.add('open')}
function closeModal(){document.getElementById('modalbg').classList.remove('open')}
document.getElementById('modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')closeModal()});
function renderMainOnly(){
  const m=document.getElementById('main');
  const active=document.activeElement;const val=active&&active.value;const isSearch=active&&active.tagName==='INPUT';
  m.innerHTML=views[curTab]();
  if(isSearch){const inp=m.querySelector('input');if(inp){inp.focus();inp.value=val;inp.setSelectionRange(val.length,val.length)}}
}
const views={plan:viewPlan,recipes:viewRecipes,products:viewProducts,shop:viewShop,calc:viewCalc,arch:viewArch,set:viewSet};
function render(){document.getElementById('main').innerHTML=views[curTab]()}
(async()=>{await loadState();renderTabs();render()})();
</script>
</body>
